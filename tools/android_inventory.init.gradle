// Read-only resolution task: records the actual release Maven artifacts.
import groovy.json.JsonOutput
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    app.tasks.register('mitsDependencyInventory') {
        doLast {
            def entries = app.configurations.getByName('releaseRuntimeClasspath')
                .incoming.resolutionResult.allComponents.findAll { component ->
                    component.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
                }.collect { component ->
                    def id = component.id
                    [group: id.group, name: id.module, version: id.version]
                }.unique().sort { a, b -> "${a.group}:${a.name}" <=> "${b.group}:${b.name}" }
            def output = System.getenv('MITS_DEPENDENCY_INVENTORY')
            if (!output) throw new GradleException('Set MITS_DEPENDENCY_INVENTORY to a local JSON output path.')
            new File(output).text = JsonOutput.prettyPrint(JsonOutput.toJson([
                configuration: 'releaseRuntimeClasspath', packages: entries
            ])) + '\n'
            println("Recorded ${entries.size()} resolved Android artifacts.")
        }
    }
}
