name: mits_kids_youtube
description: Parent-controlled YouTube wrapper with filtering and an offline library.
publish_to: none
version: 0.4.8+12

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  http: ^1.6.0
  youtube_explode_dart: 3.1.0
  flutter:
    sdk: flutter
  flutter_inappwebview: 6.2.0-beta.3
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  dio: ^5.8.0+1
  sqflite: ^2.4.2
  path: ^1.9.1
  video_player: ^2.9.5
  crypto: ^3.0.6

dev_dependencies:
  video_player_platform_interface: 6.9.0
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
